[project]
name = "deepbrief-api"
version = "0.1.0"
description = "FastAPI backend for the DeepBrief multi-agent research platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "langchain>=1.0.0,<2.0.0",
    "langchain-google-genai>=4.0.0,<5.0.0",
    "pydantic-settings>=2.6.0",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

